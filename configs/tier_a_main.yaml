experiment: tier_a_main
description: "Tier A main grid — n=5, N=60/60, 3 seeds, parallelised"

datasets:
  - wbcd
  - gse2034

seeds: [0, 1, 2]

n_qubits: 5
reps: [1, 2, 3]

# Depolarizing noise probability (p-convention per guide)
noise_p: [0.0, 0.002, 0.01, 0.03]

# Feature-map bandwidth (c)
bandwidth: [0.5, 1.0]

train_size: 60
test_size: 60

attacks: [A0, A1, A2]

# Relative eps values: {0.05, 0.1, 0.2, 0.4} * d_med
eps_rel: [0.05, 0.1, 0.2, 0.4]

# PGD settings
pgd_T: 40
pgd_R: 3

# Large-eps for M2 masking diagnostic
eps_large_rel: 5.0

# Joblib parallelism — use -1 for all cores, or a fixed number
n_jobs: 1
results_file: tier_a_results.csv
omics_select_k: 1000
